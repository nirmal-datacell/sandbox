<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users</title>
    <style>
      :root {
        --accent: #f6821f;
        --border: #ddd;
        --muted: #666;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #fafafa;
        color: #222;
      }
      main {
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 24px;
      }
      form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      input {
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
      }
      input[name="username"] {
        flex: 2 1 160px;
      }
      input[name="age"] {
        flex: 1 1 80px;
      }
      button {
        padding: 8px 14px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }
      button.secondary {
        background: #e5e5e5;
        color: #222;
      }
      button.danger {
        background: #d9534f;
      }
      #message {
        min-height: 1.4em;
        margin: 0 0 16px;
        color: #c0392b;
      }
      #message.ok {
        color: #2e7d32;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      th,
      td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      th {
        background: #f3f3f3;
        font-weight: 600;
      }
      td.actions {
        text-align: right;
        white-space: nowrap;
      }
      td.actions button {
        padding: 4px 10px;
        margin-left: 4px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Users</h1>
      <p class="sub">GitHub Pages → Cloudflare Worker → D1</p>

      <form id="user-form">
        <input name="username" placeholder="Username" required maxlength="50" />
        <input
          name="age"
          type="number"
          placeholder="Age"
          required
          min="0"
          max="150"
        />
        <button type="submit" id="submit-btn">Add user</button>
        <button type="button" id="cancel-btn" class="secondary" hidden>
          Cancel
        </button>
      </form>
      <p id="message"></p>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Age</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr>
            <td colspan="4" class="empty">Loading…</td>
          </tr>
        </tbody>
      </table>
    </main>

    <script>
      // Your Worker's URL. Local testing uses wrangler dev; replace the second
      // value with the URL that `npx wrangler deploy` prints.
      const API_BASE = ["localhost", "127.0.0.1"].includes(location.hostname)
        ? "http://localhost:8787"
        : "https://users-api.nirmal-datacell.workers.dev";

      const form = document.getElementById("user-form");
      const rows = document.getElementById("rows");
      const message = document.getElementById("message");
      const submitBtn = document.getElementById("submit-btn");
      const cancelBtn = document.getElementById("cancel-btn");
      let editingId = null;

      async function api(path, options = {}) {
        const res = await fetch(API_BASE + path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok)
          throw new Error(data.error || `Request failed (${res.status})`);
        return data;
      }

      function showMessage(text, ok = false) {
        message.textContent = text;
        message.className = ok ? "ok" : "";
      }

      // READ
      async function loadUsers() {
        try {
          const users = await api("/api/users");
          rows.replaceChildren();
          if (users.length === 0) {
            rows.innerHTML =
              '<tr><td colspan="4" class="empty">No users yet</td></tr>';
            return;
          }
          for (const u of users) {
            const tr = document.createElement("tr");
            for (const value of [u.id, u.username, u.age]) {
              const td = document.createElement("td");
              td.textContent = value; // textContent keeps user input from being run as HTML
              tr.append(td);
            }
            const actions = document.createElement("td");
            actions.className = "actions";
            const edit = Object.assign(document.createElement("button"), {
              textContent: "Edit",
              className: "secondary",
            });
            const del = Object.assign(document.createElement("button"), {
              textContent: "Delete",
              className: "danger",
            });
            edit.onclick = () => startEdit(u);
            del.onclick = () => deleteUser(u);
            actions.append(edit, del);
            tr.append(actions);
            rows.append(tr);
          }
        } catch (err) {
          rows.innerHTML =
            '<tr><td colspan="4" class="empty">Could not load users</td></tr>';
          showMessage(err.message);
        }
      }

      // CREATE / UPDATE
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = JSON.stringify({
          username: form.username.value,
          age: Number(form.age.value),
        });
        try {
          if (editingId === null) {
            await api("/api/users", { method: "POST", body });
            showMessage("User added", true);
          } else {
            await api(`/api/users/${editingId}`, { method: "PUT", body });
            showMessage("User updated", true);
          }
          resetForm();
          loadUsers();
        } catch (err) {
          showMessage(err.message);
        }
      });

      function startEdit(user) {
        editingId = user.id;
        form.username.value = user.username;
        form.age.value = user.age;
        submitBtn.textContent = "Save changes";
        cancelBtn.hidden = false;
        form.username.focus();
      }

      function resetForm() {
        editingId = null;
        form.reset();
        submitBtn.textContent = "Add user";
        cancelBtn.hidden = true;
      }
      cancelBtn.onclick = () => {
        resetForm();
        showMessage("");
      };

      // DELETE
      async function deleteUser(user) {
        if (!confirm(`Delete ${user.username}?`)) return;
        try {
          await api(`/api/users/${user.id}`, { method: "DELETE" });
          if (editingId === user.id) resetForm();
          showMessage("User deleted", true);
          loadUsers();
        } catch (err) {
          showMessage(err.message);
        }
      }

      loadUsers();
    </script>
  </body>
</html>
